
name: Test Ziwei Cross-Year Dedup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossyear-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download three years
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          mkdir -p data
          for year in 1997 1998 1999; do
            gh release download v4.0-13d-backup \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "year-${year}.jsonl.zst" \
              --dir data
          done

      - name: Analyze shared text
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import os
          import subprocess
          from collections import defaultdict

          years = [1997, 1998, 1999]
          text_sets = {}
          topic_sets = defaultdict(dict)
          counts = {}

          for year in years:
              path = f"data/year-{year}.jsonl.zst"
              unique = set()
              topics = defaultdict(set)
              count = 0

              process = subprocess.Popen(
                  ["zstd", "-dc", path],
                  stdout=subprocess.PIPE,
                  text=True,
                  encoding="utf-8"
              )

              for line in process.stdout:
                  item = json.loads(line)
                  count += 1

                  for topic, content in item["c"].items():
                      value = (
                          topic + "\0" + content
                      ).encode("utf-8")

                      digest = hashlib.sha256(
                          value
                      ).digest()

                      unique.add(digest)
                      topics[topic].add(digest)

              if process.wait() != 0:
                  raise RuntimeError(
                      f"Decompression failed: {year}"
                  )

              if count != 8760:
                  raise ValueError(
                      f"Unexpected count for {year}"
                  )

              counts[year] = count
              text_sets[year] = unique

              for topic, values in topics.items():
                  topic_sets[topic][year] = values

          all_texts = set().union(
              *(text_sets[y] for y in years)
          )

          separate = sum(
              len(text_sets[y]) for y in years
          )

          shared = len(
              text_sets[1997] &
              text_sets[1998] &
              text_sets[1999]
          )

          saved = 100 * (
              1 - len(all_texts) / separate
          )

          report = [
              "# Ziwei Cross-Year Dedup Report",
              "",
              "Years: 1997, 1998, 1999",
              f"Charts: {sum(counts.values())}",
              f"Independent unique-text total: {separate}",
              f"Global unique texts: {len(all_texts)}",
              f"Shared across all 3 years: {shared}",
              f"Global dedup reduction: {saved:.2f}%",
              "",
              "| Topic | 1997 | 1998 | 1999 | Global |",
              "|---|---:|---:|---:|---:|"
          ]

          for topic, yearly in sorted(topic_sets.items()):
              union = set().union(
                  *(yearly.get(y, set()) for y in years)
              )

              report.append(
                  f"| {topic} | "
                  f"{len(yearly.get(1997, set()))} | "
                  f"{len(yearly.get(1998, set()))} | "
                  f"{len(yearly.get(1999, set()))} | "
                  f"{len(union)} |"
              )

          report += [
              "",
              "Hash comparison uses SHA-256.",
              "No Cloudflare data was modified."
          ]

          output = "\n".join(report)
          print(output)

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a", encoding="utf-8"
          ) as f:
              f.write(output + "\n")
          PY
