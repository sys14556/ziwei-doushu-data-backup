name: Deploy Ziwei January Sample to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-sample:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download 1998 dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          gh release download v4.0-13d-backup \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'year-1998.jsonl.zst' \
            --dir .

      - name: Build January 1998 sample
        run: |
          mkdir -p public/data
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          source = Path('year-1998.jsonl.zst')
          target = Path('january-1998.jsonl')
          if not source.is_file():
              raise FileNotFoundError(source)

          process = subprocess.Popen(
              ['zstd', '-dc', str(source)],
              stdout=subprocess.PIPE,
              text=True,
              encoding='utf-8',
          )
          count = 0
          keys = set()
          with target.open('w', encoding='utf-8') as output:
              for line in process.stdout:
                  chart = json.loads(line)
                  if int(chart['y']) == 1998 and int(chart['m']) == 1:
                      if not isinstance(chart.get('c'), dict):
                          raise ValueError('Missing 13-topic readings')
                      key = chart['k']
                      if key in keys:
                          raise ValueError(f'Duplicate chart key: {key}')
                      keys.add(key)
                      output.write(line)
                      count += 1
          if process.wait() != 0:
              raise RuntimeError('zstd decompression failed')
          if count != 744:
              raise ValueError(f'Expected 744 charts, got {count}')
          print(f'Validated {count} January 1998 charts')
          PY
          zstd -q -f -15 january-1998.jsonl -o public/data/1998-01.jsonl.zst
          python3 - <<'PY'
          import json
          from pathlib import Path
          packed = Path('public/data/1998-01.jsonl.zst')
          size = packed.stat().st_size
          if size >= 25 * 1024 * 1024:
              raise ValueError(f'File too large for Pages: {size} bytes')
          Path('public/data/1998-01.meta.json').write_text(
              json.dumps({'year':1998,'month':1,'charts':744,
                          'bytes':size,'compression':'zstd'},
                         ensure_ascii=False),
              encoding='utf-8'
          )
          print(f'Compressed January sample: {size:,} bytes')
          PY
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN"><meta charset="UTF-8"><title>紫微斗数数据服务</title>
          <body><h1>紫微斗数数据服务</h1><p>1998 年 1 月测试数据已部署。</p>
          <p><a href="/data/1998-01.meta.json">查看测试文件信息</a></p></body></html>
          EOF
          cat > public/_headers <<'EOF'
          /data/*
            Access-Control-Allow-Origin: *
            Cache-Control: public, max-age=3600
          EOF

      - name: Deploy sample to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=ziwei-dataset --branch=main
