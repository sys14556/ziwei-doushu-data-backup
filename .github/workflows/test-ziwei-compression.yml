
name: Test Ziwei 1998 Compression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compression-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install zstd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

      - name: Download 1998 dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download v4.0-13d-backup \
            --repo "${{ github.repository }}" \
            --pattern "year-1998.jsonl.zst" \
            --dir data
          test -s data/year-1998.jsonl.zst

      - name: Measure compression
        run: |
          python3 - <<'PY'
          import json
          import gzip
          import shutil
          import subprocess
          import os
          from pathlib import Path
          from collections import Counter

          source = Path("data/year-1998.jsonl.zst")
          folder = Path("monthly")
          folder.mkdir(exist_ok=True)

          process = subprocess.Popen(
              ["zstd", "-dc", str(source)],
              stdout=subprocess.PIPE,
              text=True,
              encoding="utf-8"
          )

          handles = {}
          counts = Counter()

          try:
              for line in process.stdout:
                  item = json.loads(line)
                  if int(item["y"]) != 1998:
                      raise ValueError("Unexpected year")

                  month = int(item["m"])
                  if month not in handles:
                      path = folder / f"1998-{month:02d}.jsonl"
                      handles[month] = path.open(
                          "w", encoding="utf-8"
                      )

                  handles[month].write(line)
                  counts[month] += 1
          finally:
              for handle in handles.values():
                  handle.close()

          if process.wait() != 0:
              raise RuntimeError("Decompression failed")

          if sum(counts.values()) != 8760:
              raise ValueError("Unexpected chart count")

          rows = []
          total_gzip = 0
          total_zstd = 0

          for month in sorted(counts):
              path = folder / f"1998-{month:02d}.jsonl"
              gz_path = Path(str(path) + ".gz")
              zs_path = Path(str(path) + ".zst")

              with path.open("rb") as src:
                  with gzip.open(
                      gz_path, "wb", compresslevel=6
                  ) as dst:
                      shutil.copyfileobj(src, dst)

              subprocess.run(
                  [
                      "zstd", "-q", "-T2", "-15",
                      str(path), "-o", str(zs_path)
                  ],
                  check=True
              )

              gz_size = gz_path.stat().st_size
              zs_size = zs_path.stat().st_size

              total_gzip += gz_size
              total_zstd += zs_size

              rows.append(
                  (month, counts[month], gz_size, zs_size)
              )

          def mb(value):
              return f"{value / 1048576:.2f}"

          report = [
              "# Ziwei 1998 Compression Report",
              "",
              f"Charts: {sum(counts.values())}",
              f"Original zstd: {mb(source.stat().st_size)} MB",
              f"Monthly gzip total: {mb(total_gzip)} MB",
              f"Monthly zstd total: {mb(total_zstd)} MB",
              "",
              "| Month | Charts | gzip MB | zstd MB |",
              "|---|---:|---:|---:|"
          ]

          for month, count, gz, zs in rows:
              report.append(
                  f"| {month:02d} | {count} | "
                  f"{mb(gz)} | {mb(zs)} |"
              )

          report += [
              "",
              "These are compression measurements only.",
              "No data was uploaded to Cloudflare KV."
          ]

          output = "\n".join(report)
          print(output)

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a", encoding="utf-8"
          ) as file:
              file.write(output + "\n")
          PY
