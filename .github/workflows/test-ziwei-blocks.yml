
name: Test Ziwei Zstd Blocks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install and download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          gh release download v4.0-13d-backup \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "year-1998.jsonl.zst" \
            --dir .

      - name: Benchmark blocks
        run: |
          python3 - <<'PY'
          import os
          import json
          import hashlib
          import subprocess
          from pathlib import Path
          from datetime import date

          root = Path("blocks")
          samples = Path("samples")
          samples.mkdir(exist_ok=True)

          handles = {}
          count = 0

          p = subprocess.Popen(
              ["zstd", "-dc", "year-1998.jsonl.zst"],
              stdout=subprocess.PIPE,
              text=True,
              encoding="utf-8"
          )

          try:
              for line in p.stdout:
                  item = json.loads(line)
                  y = int(item["y"])
                  m = int(item["m"])
                  d = int(item["d"])

                  if y != 1998:
                      raise ValueError("Unexpected year")

                  day = date(y, m, d)
                  week = (
                      day - date(1998, 1, 1)
                  ).days // 7

                  names = {
                      "day": day.isoformat(),
                      "week": f"1998-w{week:02d}",
                      "month": f"1998-{m:02d}"
                  }

                  for group, name in names.items():
                      path = root / group / (name + ".jsonl")
                      if path not in handles:
                          path.parent.mkdir(
                              parents=True, exist_ok=True
                          )
                          handles[path] = path.open(
                              "w", encoding="utf-8"
                          )
                      handles[path].write(line)

                  if count % 40 == 0:
                      (samples / f"{count:05d}.txt").write_text(
                          line, encoding="utf-8"
                      )

                  count += 1
          finally:
              for f in handles.values():
                  f.close()

          if p.wait() != 0 or count != 8760:
              raise RuntimeError(
                  f"Invalid source, count={count}"
              )

          dictionary = Path("ziwei-1998.dict")

          subprocess.run(
              [
                  "zstd", "-q", "--train", "-r",
                  str(samples),
                  "--maxdict=131072",
                  "-o", str(dictionary)
              ],
              check=True
          )

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          rows = []
          limit = 25 * 1024 * 1024

          for group in ("day", "week", "month"):
              files = sorted((root / group).glob("*.jsonl"))

              for use_dict in (False, True):
                  mode = "dictionary" if use_dict else "plain"
                  total = 0
                  largest = 0

                  for path in files:
                      out = Path(
                          str(path) + "." + mode + ".zst"
                      )

                      cmd = ["zstd", "-q", "-15", "-f"]

                      if use_dict:
                          cmd += ["-D", str(dictionary)]

                      cmd += [
                          str(path), "-o", str(out)
                      ]

                      subprocess.run(cmd, check=True)

                      size = out.stat().st_size
                      total += size
                      largest = max(largest, size)

                  # Verify the first block for every mode.
                  original = files[0]
                  packed = Path(
                      str(original) + "." + mode + ".zst"
                  )

                  cmd = ["zstd", "-q", "-dc"]

                  if use_dict:
                      cmd += ["-D", str(dictionary)]

                  cmd += [str(packed)]

                  decoded = subprocess.run(
                      cmd,
                      capture_output=True,
                      check=True
                  ).stdout

                  if sha256(decoded) != sha256(
                      original.read_bytes()
                  ):
                      raise ValueError(
                          f"Round-trip failed: {group}/{mode}"
                      )

                  rows.append(
                      (group, mode, len(files), total, largest)
                  )

          mb = lambda x: f"{x / 1048576:.2f}"

          report = [
              "# Ziwei 1998 Zstd Block Report",
              "",
              f"Charts: {count}",
              f"Dictionary size: {mb(dictionary.stat().st_size)} MB",
              "Sample block round-trips: PASS",
              "",
              "| Group | Mode | Keys | Total MB | Largest MB |",
              "|---|---|---:|---:|---:|"
          ]

          for group, mode, n, total, largest in rows:
              report.append(
                  f"| {group} | {mode} | {n} | "
                  f"{mb(total)} | {mb(largest)} |"
              )

          report += [
              "",
              "77-year estimates exclude dictionaries and key overhead.",
              "",
              "| Group | Mode | 77-year estimate MB | Under 25 MiB |",
              "|---|---|---:|---|"
          ]

          for group, mode, n, total, largest in rows:
              report.append(
                  f"| {group} | {mode} | "
                  f"{mb(total * 77)} | "
                  f"{largest <= limit} |"
              )

          report += [
              "",
              "These are size measurements, not API speed tests.",
              "No Cloudflare data was modified."
          ]

          output = "\n".join(report)
          print(output)

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a", encoding="utf-8"
          ) as f:
              f.write(output + "\n")
          PY
